server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never

spring:
  application:
    name: labguard
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lab_safety?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false
  jackson:
    time-zone: Asia/Shanghai
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0

logging:
  level:
    root: INFO
    edu.lab: INFO

labguard:
  security:
    session-timeout-minutes: 30
    max-login-attempts: 5
    login-block-minutes: 10
  reservation:
    max-advance-days: 60
  exam:
    question-count: 10
